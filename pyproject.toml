[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-fuel-hedge-engine"
version = "0.1.0"
description = "EIA medallion data and airline fuel hedge risk analytics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4"]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.40,<1", "mlflow>=2.17,<4"]
dev = ["ruff>=0.8,<1"]

[project.scripts]
fuel-hedge = "fuel_hedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
